name: Deploy optional testimonial photo (one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/deploy-testimonial-photo.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
      BASE: 91f58b2d7f62910436e638208315bb3ab4a7b787
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Back up and stop if the server copy changed
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /laravel_app/app/Http/Controllers/User/UserTestimonialController.php -o backup.php; bye"
          git show "$BASE:backend/app/Http/Controllers/User/UserTestimonialController.php" | diff -q -w -B --strip-trailing-cr - backup.php >/dev/null || { echo "::error::Server copy differs; aborting."; exit 1; }
      - name: Upload
        run: lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backend/app/Http/Controllers/User/UserTestimonialController.php -o /laravel_app/app/Http/Controllers/User/UserTestimonialController.php; bye"
      - name: Verify, roll back on failure
        run: |
          code() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$@"; }
          ping=$(code "$SITE/api/ping"); mine=$(code -H "Accept: application/json" "$SITE/api/user/testimonial")
          echo "ping=$ping user_testimonial=$mine"
          if [ "$ping" != 200 ] || [ "$mine" != 401 ]; then
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backup.php -o /laravel_app/app/Http/Controllers/User/UserTestimonialController.php; bye"; exit 1
          fi
