name: Deploy Google login interruption handling (one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/deploy-google-interrupted.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
      BASE: d2d8e34ac3ec1415dd20b285e8a5f36a37fb01d1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Back up and stop if the server copy changed
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /laravel_app/app/Http/Controllers/Auth/GoogleAuthController.php -o backup.php; bye"
          git show "$BASE:backend/app/Http/Controllers/Auth/GoogleAuthController.php" | diff -q -w -B --strip-trailing-cr - backup.php >/dev/null || { echo "::error::Server copy differs; aborting."; git show "$BASE:backend/app/Http/Controllers/Auth/GoogleAuthController.php" | diff -w -B --strip-trailing-cr - backup.php | head -30; exit 1; }
      - name: Upload
        run: lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backend/app/Http/Controllers/Auth/GoogleAuthController.php -o /laravel_app/app/Http/Controllers/Auth/GoogleAuthController.php; bye"
      - name: Verify, roll back on failure
        run: |
          code() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$@"; }
          ping=$(code "$SITE/api/ping")
          cb=$(curl -s -o /dev/null --max-time 20 -w '%{http_code} %{redirect_url}' "$SITE/api/auth/google/callback?code=x&state=y")
          echo "ping=$ping callback=$cb"
          if [ "$ping" != 200 ] || ! echo "$cb" | grep -q "^302 .*/login?error=google_"; then
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backup.php -o /laravel_app/app/Http/Controllers/Auth/GoogleAuthController.php; bye"; exit 1
          fi
