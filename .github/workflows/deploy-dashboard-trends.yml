name: Deploy dashboard trends (one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/deploy-dashboard-trends.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
      BASE: 0aadbc458dcfbb73ae06be1b0fef1ac9ffa91204
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Back up and stop if the server copy changed
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /laravel_app/app/Http/Controllers/Admin/DashboardController.php -o backup.php; bye"
          git show "$BASE:backend/app/Http/Controllers/Admin/DashboardController.php" | diff -q -w -B --strip-trailing-cr - backup.php >/dev/null || { echo "::error::Server copy differs; aborting."; git show "$BASE:backend/app/Http/Controllers/Admin/DashboardController.php" | diff -w -B --strip-trailing-cr - backup.php | head -40; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-backup
          path: backup.php
      - name: Upload
        run: lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backend/app/Http/Controllers/Admin/DashboardController.php -o /laravel_app/app/Http/Controllers/Admin/DashboardController.php; bye"
      - name: Verify, roll back on failure
        run: |
          code() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$@"; }
          ping=$(code "$SITE/api/ping"); dash=$(code -H "Accept: application/json" "$SITE/api/admin/dashboard")
          echo "ping=$ping dashboard_without_login=$dash"
          if [ "$ping" != 200 ] || [ "$dash" != 401 ]; then
            echo "::error::Check failed; restoring backup."
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backup.php -o /laravel_app/app/Http/Controllers/Admin/DashboardController.php; bye"
            exit 1
          fi
