name: Deploy audit log fix (one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/deploy-audit-fix.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
      BASE: 3a19dd756143794d0f62bcde3d241cb889ca34c9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Back up and stop if the server copy changed
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /laravel_app/app/Services/AuditTrail.php -o backup.php; bye"
          if ! git show "$BASE:backend/app/Services/AuditTrail.php" | diff -q -w -B --strip-trailing-cr - backup.php >/dev/null; then
            echo "::error::Server copy differs from the repo; aborting."
            git show "$BASE:backend/app/Services/AuditTrail.php" | diff -w -B --strip-trailing-cr - backup.php | head -40
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: audit-backup
          path: backup.php
      - name: Upload
        run: lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backend/app/Services/AuditTrail.php -o /laravel_app/app/Services/AuditTrail.php; bye"
      - name: Verify, roll back on failure
        run: |
          code() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$@"; }
          ping=$(code "$SITE/api/ping"); home=$(code "$SITE/api/public/home"); me=$(code -H "Accept: application/json" "$SITE/api/auth/me")
          echo "ping=$ping home=$home me=$me"
          if [ "$ping" != 200 ] || [ "$home" != 200 ] || [ "$me" != 401 ]; then
            echo "::error::Check failed; restoring backup."
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backup.php -o /laravel_app/app/Services/AuditTrail.php; bye"
            exit 1
          fi
