name: Inspect upload limits and errors (read-only, one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/inspect-limits.yml"]

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
    steps:
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Config files and log
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /php.ini -o php.ini; get /.user.ini -o user.ini; get /laravel_app/storage/logs/laravel.log -o laravel.log; bye" || true
          echo "== /php.ini (limits)"; grep -iE "upload_max|post_max|max_file_uploads|memory_limit|max_execution|max_input" php.ini || echo "(none)"
          echo "== /.user.ini (limits)"; grep -iE "upload_max|post_max|max_file_uploads|memory_limit|max_execution|max_input" user.ini || echo "(none)"
          echo "== errors with exception class (last 25)"
          grep -E "^\[[0-9-]+ [0-9:]+\] [a-z]+\.(ERROR|CRITICAL|WARNING)" laravel.log | tail -25 | cut -c1-200
          echo "== upload/size related lines"
          grep -iE "PostTooLarge|too large|upload|413|Allowed memory|max_execution|Maximum execution" laravel.log | tail -10 | cut -c1-220 || echo "(none)"
      - name: Effective PHP limits through a one-time script
        run: |
          TOKEN=$(openssl rand -hex 24); NAME="lim-$(openssl rand -hex 10).php"; echo "$NAME" > name.txt
          cat > "$NAME" <<PHP
          <?php if (!hash_equals('$TOKEN', (string) (\$_GET['t'] ?? ''))) { http_response_code(404); exit; }
          header('Content-Type: text/plain');
          foreach (['upload_max_filesize','post_max_size','max_file_uploads','memory_limit','max_execution_time','max_input_time'] as \$k) echo \$k, '=', ini_get(\$k), "\n";
          echo 'php=', PHP_VERSION, ' sapi=', PHP_SAPI, "\n";
          PHP
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put $NAME -o /$NAME; bye"
          curl -sS --max-time 30 "$SITE/$NAME?t=$TOKEN"
      - name: Remove script
        if: always()
        run: '[ -f name.txt ] && lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; rm /$(cat name.txt); bye" || true'
      - name: What happens with large bodies (no login, rejected by auth anyway)
        run: |
          for mb in 8 13 21; do
            head -c $((mb*1024*1024)) /dev/urandom > blob.bin
            printf "%sMB -> " $mb; curl -s -o /tmp/r -w "%{http_code} %{time_total}s" --max-time 120 -H "Accept: application/json" -F "f=@blob.bin" "$SITE/api/user/oprec/register" || printf "FAILED exit=$?"
            echo " | $(head -c 120 /tmp/r 2>/dev/null)"
          done
