name: Health probe (read-only, one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/health-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
    steps:
      - name: HTTP checks
        run: |
          for p in / /login/ /events/ /api/ping /api/public/home /api/public/oprec /api/public/events; do
            printf "%-22s " "$p"; curl -s -o /tmp/b -w "%{http_code} %{time_total}s server=%{remote_ip}\n" --max-time 30 "$SITE$p" || echo "FAILED (no response)"
            head -c 160 /tmp/b | tr '\n' ' ' | grep -iE "imunify|error|exception|suspend|bandwidth|limit|maintenance|503|500" && echo || true
          done
          echo "== DNS"; getent hosts himanika.wsmif.myhost.id || echo "DNS failed"
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: FTP and latest Laravel errors
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; set net:max-retries 1; set net:timeout 20; get /laravel_app/storage/logs/laravel.log -o laravel.log; cls -l /laravel_app/storage/logs/; bye" || echo "FTP failed"
          if [ -f laravel.log ]; then
            echo "== last 12 errors (first line)"; grep -E "^\[[0-9-]+ [0-9:]+\] [a-z]+\.(ERROR|CRITICAL|ALERT|EMERGENCY)" laravel.log | tail -12 | cut -c1-240
            echo "== errors per day (last 7)"; grep -oE "^\[[0-9-]+ " laravel.log | sort | uniq -c | tail -7
          fi
