name: Deploy testimonial rebuild (one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/deploy-testimonial-rebuild.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
      BASE: 0f903d837d8371493a8e000f29c13af2d4053d1c
      CHANGED: routes/api.php app/Http/Controllers/Admin/HomeContentController.php app/Http/Controllers/Public/HomeContentController.php app/Http/Controllers/User/UserTestimonialController.php app/Http/Controllers/Admin/OprecController.php app/Http/Middleware/NoStoreApiResponse.php
      NEW: app/Support/ImageCompressor.php app/Support/TestimonialForm.php
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Back up and stop if the server copies changed
        run: |
          for f in $CHANGED; do
            mkdir -p "backup/$(dirname $f)"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /laravel_app/$f -o backup/$f; bye"
            git show "$BASE:backend/$f" | diff -q -w -B --strip-trailing-cr - "backup/$f" >/dev/null || { echo "::error::Server copy of $f differs; aborting."; git show "$BASE:backend/$f" | diff -w -B --strip-trailing-cr - "backup/$f" | head -40; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: testimonial-rebuild-backup
          path: backup/
      - name: Upload (new support classes first, routes last)
        run: |
          for f in $NEW $CHANGED; do lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backend/$f -o /laravel_app/$f; bye"; done
      - name: Verify, roll back code on failure
        run: |
          code() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$@"; }
          ping=$(code "$SITE/api/ping"); home=$(code "$SITE/api/public/home"); oprec=$(code "$SITE/api/public/oprec")
          mine=$(code -H "Accept: application/json" "$SITE/api/user/testimonial"); form=$(code -H "Accept: application/json" "$SITE/api/admin/home-content/testimonial-form")
          echo "ping=$ping home=$home oprec=$oprec user_testimonial=$mine admin_form=$form"
          if [ "$ping" != 200 ] || [ "$home" != 200 ] || [ "$oprec" != 200 ] || [ "$mine" != 401 ] || [ "$form" != 401 ]; then
            echo "::error::Check failed; restoring previous code."
            for f in $CHANGED; do lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backup/$f -o /laravel_app/$f; bye"; done
            exit 1
          fi

      - name: Delete user-submitted testimonials (admin-made ones stay)
        run: |
          TOKEN=$(openssl rand -hex 24)
          NAME="cleanup-$(openssl rand -hex 10).php"
          echo "$NAME" > script-name.txt
          sed "s/__TOKEN__/$TOKEN/" > "$NAME" <<'PHP'
          <?php
          if (!hash_equals('__TOKEN__', (string) ($_GET['t'] ?? ''))) { http_response_code(404); exit; }
          header('Content-Type: text/plain');
          require __DIR__.'/laravel_app/vendor/autoload.php';
          $app = require __DIR__.'/laravel_app/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db = Illuminate\Support\Facades\DB::class;
          $disk = Illuminate\Support\Facades\Storage::disk('public');
          $rows = $db::table('testimonials')->whereNotNull('user_id')->get(['id', 'foto']);
          echo 'before_total=', $db::table('testimonials')->count(), "\n";
          echo 'user_rows=', $rows->count(), "\n";
          $db::table('testimonials')->whereIn('id', $rows->pluck('id'))->delete();
          $files = 0;
          foreach ($rows->pluck('foto')->filter()->unique() as $path) {
              // Only photos uploaded through the old form; never profile photos or shared files.
              if (str_starts_with($path, 'landing/testimonials/') && !$db::table('testimonials')->where('foto', $path)->exists() && $disk->delete($path)) $files++;
          }
          echo 'files_deleted=', $files, "\n";
          echo 'after_total=', $db::table('testimonials')->count(), "\n";
          echo "status=0\n";
          PHP
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put $NAME -o /$NAME; bye"
          curl -sS --max-time 120 "$SITE/$NAME?t=$TOKEN" | tee result.txt
          grep -q "status=0" result.txt
      - name: Remove the one-time script
        if: always()
        run: |
          [ -f script-name.txt ] || exit 0
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; rm /$(cat script-name.txt); bye" && echo "Script removed."
      - name: Final check
        run: |
          echo -n "home HTTP "; curl -s -o /dev/null -w "%{http_code}\n" "$SITE/api/public/home"
          curl -s "$SITE/api/public/home" | grep -o '"testimonials":\[[^]]*' | grep -o '"nama":"[^"]*"' || true
