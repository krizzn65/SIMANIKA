name: Deploy pending enrollments (one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/deploy-pending-enrollments.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
      BASE: eab72e3a8409c4bf3e3f9972ea3cc5797eccc6b6
      CHANGED: app/Http/Controllers/Admin/OprecRegistrantController.php routes/api.php
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Back up and stop if the server copies changed
        run: |
          for f in $CHANGED; do
            mkdir -p "backup/$(dirname $f)"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /laravel_app/$f -o backup/$f; bye"
            git show "$BASE:backend/$f" | diff -q -w -B --strip-trailing-cr - "backup/$f" >/dev/null || { echo "::error::Server copy of $f differs; aborting."; git show "$BASE:backend/$f" | diff -w -B --strip-trailing-cr - "backup/$f" | head -30; exit 1; }
          done
      - name: Upload
        run: for f in $CHANGED; do lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backend/$f -o /laravel_app/$f; bye"; done
      - name: Verify, roll back on failure
        run: |
          code() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$@"; }
          ping=$(code "$SITE/api/ping"); home=$(code "$SITE/api/public/home"); pend=$(code -H "Accept: application/json" "$SITE/api/admin/oprec/1/registrants/pending")
          echo "ping=$ping home=$home pending_without_login=$pend"
          if [ "$ping" != 200 ] || [ "$home" != 200 ] || [ "$pend" != 401 ]; then
            for f in $CHANGED; do lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backup/$f -o /laravel_app/$f; bye"; done; exit 1
          fi
