name: Diagnose login (read-only)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/diagnose-login.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Time auth endpoints on the live site
        run: |
          SITE=https://himanika.wsmif.myhost.id
          for path in /api/ping /sanctum/csrf-cookie /api/auth/me /api/auth/google/redirect /api/public/home; do
            echo "== $path"
            curl -sS -o body.txt -D headers.txt --max-time 40 \
              -w "status=%{http_code} total=%{time_total}s ttfb=%{time_starttransfer}s\n" "$SITE$path" || echo "curl failed"
            grep -iE "^(location|server|x-|set-cookie: [a-z_]+=)" headers.txt | sed -E 's/(set-cookie: [a-z_-]+=)[^;]*/\1<redacted>/I' | head -8
            head -c 200 body.txt; echo
          done
