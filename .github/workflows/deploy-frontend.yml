name: Deploy frontend (FTP)

on:
  push:
    branches: [only_deploy]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: https://himanika.wsmif.myhost.id/api
      API_BASE_URL: https://himanika.wsmif.myhost.id/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      # Uploads only the static export; never deletes files on the server
      # (backend, .htaccess, .env stay untouched).
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

      - name: Lighthouse mobile on the live site
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@12 https://himanika.wsmif.myhost.id/ --only-categories=performance --form-factor=mobile \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh.json --quiet
            jq -r '"score \(.categories.performance.score*100)  FCP \(.audits["first-contentful-paint"].displayValue)  LCP \(.audits["largest-contentful-paint"].displayValue)  TBT \(.audits["total-blocking-time"].displayValue)  CLS \(.audits["cumulative-layout-shift"].displayValue)"' lh.json
          done
