name: Inspect root htaccess (read-only, one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/inspect-htaccess.yml"]

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
    steps:
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Read root files
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /.htaccess -o root.htaccess; get /index.php -o root-index.php; cls -1 /; bye"
          echo "===== /.htaccess"; cat root.htaccess
          echo "===== /index.php"; cat root-index.php
      - name: Probe unknown paths
        run: |
          for p in "/z0f76a1d14fd21a8fb5fd0d03e0fdc3d3cedae52f?wsidchk=1" "/tidak-ada/" "/login/?reason=session_expired"; do
            echo "===== $p"; curl -s -o /dev/null -D - --max-time 20 "$SITE$p" | grep -iE "^(HTTP|server|content-type|x-powered|location)"
          done
