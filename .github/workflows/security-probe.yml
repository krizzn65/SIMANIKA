name: Deploy rate limits (one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/security-probe.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
      BASE: 07f7f33becea8cb4f8f7e9d8263788843a1caa7a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq lftp >/dev/null

      - name: Back up and stop if the server copies changed
        run: |
          mkdir -p backup
          for f in app/Providers/AppServiceProvider.php bootstrap/app.php; do
            mkdir -p "backup/$(dirname $f)"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /laravel_app/$f -o backup/$f; bye"
            if ! git show "$BASE:backend/$f" | diff -q -w -B --strip-trailing-cr - "backup/$f" >/dev/null; then
              echo "::error::Server copy of $f differs from the repo; aborting."
              git show "$BASE:backend/$f" | diff -w -B --strip-trailing-cr - "backup/$f" | head -40
              exit 1
            fi
            echo "OK: $f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rate-limit-backup
          path: backup/

      - name: Upload
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no;
            put backend/app/Providers/AppServiceProvider.php -o /laravel_app/app/Providers/AppServiceProvider.php;
            put backend/bootstrap/app.php -o /laravel_app/bootstrap/app.php;
            bye"

      - name: Verify, roll back on failure
        run: |
          code() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$@"; }
          ping=$(code "$SITE/api/ping"); home=$(code "$SITE/api/public/home")
          login=$(code -X POST -H "Accept: application/json" -H "Content-Type: application/json" -d '{"email":"probe@example.invalid","password":"x"}' "$SITE/api/auth/login")
          echo "ping=$ping home=$home login(bad creds)=$login"
          if [ "$ping" != 200 ] || [ "$home" != 200 ] || [ "$login" = 500 ] || [ "$login" = 000 ]; then
            echo "::error::Check failed; restoring backups."
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no;
              put backup/app/Providers/AppServiceProvider.php -o /laravel_app/app/Providers/AppServiceProvider.php;
              put backup/bootstrap/app.php -o /laravel_app/bootstrap/app.php;
              bye"
            exit 1
          fi
          echo "== rate-limit headers on a public API call"
          curl -sI --max-time 20 "$SITE/api/public/home" | grep -i "^x-ratelimit" || echo "(none)"
