name: Read server provider files (one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/security-probe.yml"]

jobs:
  read:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Print server copies that differ from the repo (code only, no .env)
        run: |
          mkdir server
          for f in app/Providers/AppServiceProvider.php bootstrap/app.php bootstrap/providers.php app/Http/Controllers/Auth/LoginController.php; do
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /laravel_app/$f -o server/$(basename $f); bye"
            if diff -q --strip-trailing-cr "backend/$f" "server/$(basename $f)" >/dev/null; then
              echo "=== SAME as repo: $f"
            else
              echo "=== DIFFERENT: $f (server version below)"
              tr -d '\r' < "server/$(basename $f)"
            fi
          done
