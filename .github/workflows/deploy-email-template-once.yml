name: Deploy email template

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/deploy-email-template-once.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      BASE: a72afbc0cdfd81599c62594ec418c862a8f70616
      FILE: resources/views/emails/auth-action.blade.php
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq lftp >/dev/null

      - name: Back up the server template and stop if it differs from the repo
        run: |
          mkdir -p backup
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /laravel_app/$FILE -o backup/auth-action.blade.php; bye"
          if ! git show "$BASE:backend/$FILE" | diff -q --strip-trailing-cr - backup/auth-action.blade.php >/dev/null; then
            echo "::error::Server template differs from the repo; aborting without changes."
            git show "$BASE:backend/$FILE" | diff --strip-trailing-cr - backup/auth-action.blade.php | head -60
            exit 1
          fi
          echo "OK (identical to repo)"

      - uses: actions/upload-artifact@v4
        with:
          name: email-template-backup
          path: backup/

      - name: Upload the new template
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backend/$FILE -o /laravel_app/$FILE; bye"
          echo "Uploaded."
          echo -n "logo HTTP "; curl -sS -o /dev/null -w "%{http_code}\n" https://himanika.wsmif.myhost.id/images/logos/logo-mif-256.png
