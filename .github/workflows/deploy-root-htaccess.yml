name: Deploy root htaccess (one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/deploy-root-htaccess.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Back up and stop if the server copy changed
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /.htaccess -o backup.htaccess; bye"
          grep -q '^    RewriteRule \^ index.php \[L\]' backup.htaccess || { echo "::error::Server .htaccess changed since inspection; aborting."; cat backup.htaccess; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: root-htaccess-backup
          path: backup.htaccess
          include-hidden-files: true
      - name: Upload
        run: lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put deploy/root.htaccess -o /.htaccess; bye"
      - name: Verify, roll back on failure
        run: |
          code() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$@"; }
          ping=$(code "$SITE/api/ping"); home=$(code "$SITE/"); login=$(code "$SITE/login/?reason=session_expired")
          me=$(code -H "Accept: application/json" "$SITE/api/auth/me"); csrf=$(code "$SITE/sanctum/csrf-cookie")
          admin=$(code "$SITE/admin/logs/"); g=$(code "$SITE/api/auth/google/redirect")
          ws=$(code "$SITE/z0f76a1d14fd21a8fb5fd0d03e0fdc3d3cedae52f?wsidchk=1"); wsloc=$(curl -s -o /dev/null --max-time 20 -w '%{redirect_url}' "$SITE/z0f76a1d14fd21a8fb5fd0d03e0fdc3d3cedae52f?wsidchk=1")
          missing=$(code "$SITE/tidak-ada/"); missingphp=$(curl -s -D - -o /dev/null --max-time 20 "$SITE/tidak-ada/" | grep -ci "x-powered-by: php" || true)
          echo "ping=$ping home=$home login=$login me=$me csrf=$csrf admin=$admin google=$g ws=$ws -> $wsloc missing=$missing missing_from_php=$missingphp"
          if [ "$ping" != 200 ] || [ "$home" != 200 ] || [ "$login" != 200 ] || [ "$me" != 401 ] || [ "$csrf" != 204 ] || [ "$admin" != 200 ] || [ "$g" = 404 ] || [ "$g" = 500 ] || [ "$ws" != 302 ]; then
            echo "::error::Check failed; restoring backup."
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backup.htaccess -o /.htaccess; bye"
            exit 1
          fi
