name: Deploy HTTPS redirect (one-time)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/deploy-https-redirect.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      HOST: himanika.wsmif.myhost.id
      BASE: d86d4a7e75954cda6b71779571ca86e9bb57396c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Back up and stop if the server copy changed
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /.htaccess -o backup.htaccess; bye"
          git show "$BASE:deploy/root.htaccess" | diff -q -w -B --strip-trailing-cr - backup.htaccess >/dev/null || { echo "::error::Server .htaccess differs from repo; aborting."; git show "$BASE:deploy/root.htaccess" | diff -w -B --strip-trailing-cr - backup.htaccess | head -30; exit 1; }
          echo "== before"; curl -s -o /dev/null -w "http / -> %{http_code} %{redirect_url}\n" --max-time 20 "http://$HOST/" || echo "http failed"
      - uses: actions/upload-artifact@v4
        with:
          name: htaccess-https-backup
          path: backup.htaccess
          include-hidden-files: true
      - name: Upload
        run: lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put deploy/root.htaccess -o /.htaccess; bye"
      - name: Verify, roll back on failure
        run: |
          c() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$@"; }
          r=$(curl -s -o /dev/null --max-time 20 -w '%{http_code} %{redirect_url}' "http://$HOST/testimoni/undangan/?k=abc")
          home=$(c "https://$HOST/"); ping=$(c "https://$HOST/api/ping"); api=$(c "https://$HOST/api/public/home"); me=$(c -H "Accept: application/json" "https://$HOST/api/auth/me"); login=$(c "https://$HOST/login/")
          echo "http redirect: $r"; echo "https home=$home login=$login ping=$ping api=$api me=$me"
          if [ "$home" != 200 ] || [ "$login" != 200 ] || [ "$ping" != 200 ] || [ "$api" != 200 ] || [ "$me" != 401 ]; then
            echo "::error::Check failed; restoring backup."
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backup.htaccess -o /.htaccess; bye"; exit 1
          fi
          case "$r" in 301\ https://$HOST/testimoni/undangan/?k=abc) echo "redirect OK";; *) echo "::warning::HTTP did not redirect as expected (may be reset upstream)";; esac
