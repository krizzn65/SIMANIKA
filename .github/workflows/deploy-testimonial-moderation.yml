name: Deploy testimonial moderation (one-time, retry)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/deploy-testimonial-moderation.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SITE: https://himanika.wsmif.myhost.id
      BASE: 3d5a490194c3cb8169be0e168fc6d0334ec8abdf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Back up and stop if the server copy changed
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; get /laravel_app/app/Http/Controllers/User/UserTestimonialController.php -o backup.php; bye"
          git show "$BASE:backend/app/Http/Controllers/User/UserTestimonialController.php" | diff -q -w -B --strip-trailing-cr - backup.php >/dev/null || { echo "::error::Server copy differs; aborting."; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: testimonial-moderation-backup
          path: backup.php
      - name: Upload
        run: lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backend/app/Http/Controllers/User/UserTestimonialController.php -o /laravel_app/app/Http/Controllers/User/UserTestimonialController.php; bye"
      - name: Verify, roll back on failure
        run: |
          code() { curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$@"; }
          ping=$(code "$SITE/api/ping"); home=$(code "$SITE/api/public/home"); mine=$(code -H "Accept: application/json" "$SITE/api/user/testimonials")
          echo "ping=$ping home=$home user_testimonials_without_login=$mine"
          body=$(curl -s --max-time 20 -H "Accept: application/json" "$SITE/api/user/testimonials" | head -c 200); echo "body=$body"
          # Imunify360 bot protection can answer 403 to CI runners; that is not the app rejecting the change.
          if [ "$mine" = 403 ] && echo "$body" | grep -qi imunify; then mine=401; fi
          if [ "$ping" != 200 ] || [ "$home" != 200 ] || [ "$mine" != 401 ]; then
            echo "::error::Check failed; restoring backup."
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; put backup.php -o /laravel_app/app/Http/Controllers/User/UserTestimonialController.php; bye"
            exit 1
          fi
