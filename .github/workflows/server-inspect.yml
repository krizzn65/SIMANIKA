name: Inspect server layout (read-only)

on:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/server-inspect.yml"]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: List FTP directories (no file contents)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ssl:verify-certificate no; cls -1 /laravel_app/; echo ---; cls -l /laravel_app/routes/ /laravel_app/bootstrap/cache/ /laravel_app/app/Http/Middleware/ /laravel_app/app/Http/Controllers/Public/ /laravel_app/database/migrations/ | tail -80; echo ---; cls -l /index.php /router.php /.htaccess /info.php; bye"
