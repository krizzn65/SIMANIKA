name: Check live site

on:
  workflow_dispatch:
  push:
    branches: [only_deploy]
    paths: [".github/workflows/check-site.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Public home content (visi & misi)
        run: |
          curl -fsS https://himanika.wsmif.myhost.id/api/public/home | jq '{visi: .data.visi, misi: .data.misi}'
      - name: Deployed landing bundle contains new missions
        run: |
          curl -fsS https://himanika.wsmif.myhost.id/ -o index.html
          for js in $(grep -oE '/_next/static/chunks/[^"]+\.js' index.html | sort -u); do
            curl -fsS "https://himanika.wsmif.myhost.id$js" | grep -q "Jembatan prestasi" && echo "found in $js"
          done; true
      - name: Lighthouse mobile performance (3 runs)
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@12 https://himanika.wsmif.myhost.id/ --only-categories=performance --form-factor=mobile \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh.json --quiet
            jq -r '"score \(.categories.performance.score*100)  FCP \(.audits["first-contentful-paint"].displayValue)  LCP \(.audits["largest-contentful-paint"].displayValue)  TBT \(.audits["total-blocking-time"].displayValue)  CLS \(.audits["cumulative-layout-shift"].displayValue)"' lh.json
          done
